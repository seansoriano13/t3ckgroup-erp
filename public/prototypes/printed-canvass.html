<title>Printed Canvass</title>
<!--
  PROTOTYPE — throwaway. Ticket: Printed Canvass (#236) on the IPAS/PMS map (#210).
  Three printed canvass forms, switchable with ?variant=A|B|C, the bar, or the arrow keys.
  Contents follow "Canvass and Offers inside PMS": supplier, brand, description, source link,
  brochure, remarks, unit price in the quoted currency, validity, lead time, quality note,
  one winner. Print idiom follows ADR 0014.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  :root {
    --desk: #e7e3dc;
    --desk-ink: #1f2328;
    --desk-soft: #57606a;
    --desk-edge: #cdc7bd;
    --shadow: 0 1px 3px rgba(24,22,18,.12), 0 16px 36px rgba(24,22,18,.14);

    --paper: #ffffff;
    --ink: #0f172a;        /* High-contrast black slate for crisp legibility */
    --ink-mid: #1e293b;
    --ink-soft: #334155;   /* Secondary text (7.5:1 contrast) */
    --ink-faint: #64748b;  /* Metadata labels */
    --rule: #cbd5e1;       /* Clean crisp borders */
    --hair: #e2e8f0;       /* Fine row division */
    --wash: #f8fafc;       /* Card wash */
    --accent: #0f5b47;     /* Brand emerald / accent */
    --flag: #b91c1c;       /* Semantic alert */
    --flag-bg: #fef2f2;
    --flag-border: #fecaca;
    --ok: #15803d;         /* Semantic success / chosen offer */
    --ok-bg: #f0fdf4;
    --ok-border: #bbf7d0;
    --warn: #b45309;
    --warn-bg: #fffbeb;
    --warn-border: #fde68a;

    --sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
    --serif: "Spectral", ui-serif, Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --desk: #14171a;
      --desk-ink: #f0f2f5;
      --desk-soft: #9aa4ae;
      --desk-edge: #272c33;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 34px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    --desk: #14171a;
    --desk-ink: #f0f2f5;
    --desk-soft: #9aa4ae;
    --desk-edge: #272c33;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 34px rgba(0,0,0,.45);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--desk);
    color: var(--desk-ink);
    font-family: var(--sans);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  .desk {
    padding-block: 28px 140px;
    padding-left: 16px;
    padding-right: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  .desk-head { width: min(1000px, 100%); display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; }
  .desk-head h1 { font-family: var(--serif); font-size: 21px; font-weight: 600; margin: 0; color: var(--desk-ink); }
  .desk-head p { margin: 0; color: var(--desk-soft); font-size: 13px; max-width: 64ch; }
  .desk-head .tag { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--desk-soft); border: 1px solid var(--desk-edge); border-radius: 3px; padding: 2px 7px; }

  .sheet {
    color-scheme: light !important;
    width: 210mm;
    min-height: 297mm;
    padding: 12mm 14mm 12mm;
    background: var(--paper) !important;
    color: var(--ink) !important;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 5mm;
    font-size: 8.8pt;
    line-height: 1.36;
    border-radius: 2px;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .sheet table, .sheet tr, .sheet th, .sheet td, .grid > div {
    color: var(--ink) !important;
    font-family: inherit;
  }

  .rail { display: flex; align-items: flex-end; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
  .rail .mark { width: 24px; height: 24px; color: var(--accent); flex: none; }
  .rail .mark svg { width: 100%; height: 100%; display: block; }
  .rail .org { font-size: 7.4pt; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); line-height: 1.25; font-weight: 500; }
  .rail .org b { display: block; font-size: 10.5pt; letter-spacing: .04em; color: var(--ink); font-weight: 700; }
  .rail .doc { margin-left: auto; text-align: right; }
  .rail .doc .t { font-family: var(--serif); font-size: 16pt; font-weight: 600; line-height: 1; color: var(--ink); }
  .rail .doc .s { font-family: var(--mono); font-size: 7.5pt; color: var(--ink-soft); font-weight: 500; margin-top: 2px; }

  /* Metadata: Clean, open, no heavy box border */
  .facts {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 28px;
    padding: 8px 0;
    border-top: 1px solid var(--hair);
    border-bottom: 1px solid var(--hair);
    background: transparent;
  }
  .fact { display: flex; flex-direction: column; gap: 2px; }
  .fact .k { font-size: 6.5pt; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
  .fact .v { font-size: 9.2pt; font-weight: 600; color: var(--ink); }
  .fact .v.m { font-family: var(--mono); font-weight: 500; }

  /* Requirement box: soft background fill, no hard border */
  .ask-box {
    padding: 9px 14px;
    background: var(--wash);
    border: none;
    border-radius: 6px;
    font-size: 8.2pt;
    color: var(--ink-mid);
    line-height: 1.4;
  }
  .ask-box b { color: var(--ink); }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--hair); }
  thead th { font-size: 6.8pt; letter-spacing: .085em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; border-bottom: 1.5px solid var(--rule); }
  td.num, th.num { text-align: right; font-family: var(--mono); }
  .sub { color: var(--ink-soft); font-size: 7.2pt; }
  .m { font-family: var(--mono); }

  .chip { display: inline-flex; align-items: center; font-size: 6.6pt; letter-spacing: .07em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; font-weight: 700; line-height: 1.2; }
  .chip.win { color: var(--ok); background: var(--ok-bg); }
  .chip.warn { color: var(--flag); background: var(--flag-bg); }

  /* A — Spacious comparison matrix: No vertical cell cages */
  .grid {
    display: grid;
    grid-template-columns: 36mm repeat(3, 1fr);
    border: none;
    background: transparent;
  }
  .grid > div {
    padding: 8px 12px;
    border-bottom: 1px solid var(--hair);
    border-right: none;
    font-size: 8.5pt;
    line-height: 1.4;
  }
  .grid > div.k {
    background: transparent;
    font-size: 6.8pt;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    display: flex;
    align-items: center;
  }
  .grid > div.head {
    border-bottom: 1.5px solid var(--rule);
    background: transparent;
    padding: 9px 12px;
  }
  .grid > div.head b { font-size: 9.8pt; font-weight: 700; color: var(--ink); display: block; margin-bottom: 3px; }
  .grid > div.winner {
    background: rgba(16, 185, 129, 0.05);
  }
  .grid > div.head.winner {
    background: rgba(16, 185, 129, 0.08);
  }

  /* B — one block per supplier */
  .offer { border: 1px solid var(--hair); padding: 10px 14px; display: grid; grid-template-columns: 1fr 42mm; gap: 10px; border-radius: 6px; }
  .offer + .offer { margin-top: 4mm; }
  .offer.win { background: color-mix(in srgb, var(--ok-bg) 35%, #ffffff); }
  .offer h3 { font-family: var(--serif); font-size: 12pt; margin: 0 0 2px; font-weight: 600; color: var(--ink); }
  .offer .right { border-left: 1px solid var(--hair); padding-left: 10px; display: flex; flex-direction: column; gap: 4px; }
  .offer .right .k { font-size: 6.4pt; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
  .offer .right .v { font-family: var(--mono); font-size: 11pt; font-weight: 600; color: var(--ink); }
  .offer .right .v small { font-size: 7pt; color: var(--ink-soft); display: block; font-family: var(--sans); }

  /* C — decision first */
  .decision { border: 1.5px solid var(--hair); padding: 12px 16px; display: grid; grid-template-columns: 1fr 52mm; gap: 12px; border-radius: 6px; }
  .decision .why { font-size: 8.8pt; line-height: 1.35; }
  .decision h2 { font-family: var(--serif); font-size: 14pt; margin: 0 0 3px; font-weight: 600; color: var(--ink); }
  .decision .price { text-align: right; }
  .decision .price .v { font-family: var(--mono); font-size: 18pt; line-height: 1; letter-spacing: -.02em; color: var(--ink); font-weight: 700; }
  .decision .price .k { font-size: 6.6pt; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }

  /* Signatures: Prestigious open layout */
  .sigs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7mm; margin-top: auto; padding-top: 4mm; }
  .sig {
    display: flex; flex-direction: column;
    background: transparent; border: none;
    padding: 0;
  }
  .sig .k { font-size: 6.4pt; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
  .sig .plate { height: 12mm; border-bottom: 1.2px solid var(--ink); display: flex; align-items: flex-end; padding-bottom: 3px; margin-top: 4px; }
  .sig .plate .printed { font-family: var(--serif); font-style: italic; font-size: 11pt; color: var(--ink); font-weight: 600; }
  .sig .who { font-size: 8.4pt; font-weight: 600; color: var(--ink); margin-top: 4px; }
  .sig .role { font-size: 6.8pt; color: var(--ink-soft); margin-top: 1px; }
  .sig .stamp { font-family: var(--mono); font-size: 6.4pt; color: var(--ink-faint); margin-top: 2px; }
  .sig.awaiting .plate { border-bottom-style: dashed; border-bottom-color: var(--rule); }
  .sig.awaiting .stamp { color: var(--warn); font-weight: 600; }
  .foot { display: flex; justify-content: space-between; gap: 14px; border-top: 1px solid var(--hair); padding-top: 4px; font-size: 6.8pt; color: var(--ink-faint); font-family: var(--mono); }

  .switcher {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 50;
    display: flex;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: #f8fafc; border-radius: 999px;
    box-shadow: 0 8px 32px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.12);
    overflow: hidden;
    opacity: 0.82; transition: opacity .2s ease;
  }
  .switcher:hover { opacity: 1; }
  .switcher button { background: none; border: 0; color: inherit; font: inherit; padding: 10px 16px; cursor: pointer; font-size: 16px; line-height: 1; transition: background .15s; }
  .switcher button:hover { background: rgba(255,255,255,.12); }
  .switcher button:focus-visible { outline: 2px solid #38bdf8; outline-offset: -3px; }
  .switcher .label { padding: 8px 10px; min-width: 200px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
  .switcher .label b { font-size: 13px; font-weight: 600; }
  .switcher .label span { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #94a3b8; }

  @media print {
    @page { size: A4 portrait; margin: 0; }
    body { background: #fff; }
    .desk { padding: 0; gap: 0; }
    .desk-head, .switcher { display: none !important; }
    .sheet { box-shadow: none; page-break-after: always; min-height: 297mm; }
  }
  @media (max-width: 820px) {
    .sheet { width: 100%; min-height: 0; padding: 14px; font-size: 11px; }
    .grid { grid-template-columns: 1fr; }
    .offer, .decision { grid-template-columns: 1fr; }
    .sigs { grid-template-columns: 1fr 1fr; }
    .switcher .label { min-width: 120px; }
  }
</style>

<div class="desk">
  <div class="desk-head">
    <h1>Printed Canvass</h1>
    <span class="tag">prototype · #236</span>
    <p>Three ways to put one canvass on paper for the purchasing approver to sign. Three offers against one S0 Evaluation component, one of them foreign. Flip with the bar, the arrow keys, or <code>?variant=</code>.</p>
  </div>
  <div id="stage"></div>
</div>

<div class="switcher" role="group" aria-label="Prototype variant switcher">
  <button type="button" id="prev" aria-label="Previous variant">&#8592;</button>
  <div class="label"><b id="vname">Comparison grid</b><span id="vkey">Variant A</span></div>
  <button type="button" id="next" aria-label="Next variant">&#8594;</button>
</div>

<script>
const MARK = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="204 177 650 550" role="img" aria-label="T3CKGROUP"><path d="M492.51 240.23C492.91 240.97 492.53 241.46 493.45 241.96C495.1 242.87 508.27 242.24 511.06 242.25C530.08 242.31 549.09 242.16 568.11 242.18C632.01 242.23 695.92 241.89 759.82 242.13C776.65 242.2 793.48 242.21 810.32 242.1C815 242.06 825.21 243.53 828.76 240.84C827.84 246.58 824.24 252.21 821.99 257.65C818.53 266.04 815.56 274.69 811.94 283.01C810.26 286.89 808.16 290.61 806.56 294.54C803.77 301.39 801.24 311.91 796.63 317.49C783.01 318.59 768.84 317.65 755.14 317.69C723.03 317.81 690.93 317.84 658.82 317.86C646.35 317.87 633.89 317.91 621.41 317.76C616.52 317.7 609.38 316.33 605.07 318.83C604.78 318.34 604.89 317.74 604.27 317.47C601.72 316.35 592.79 317.18 589.62 317.17C573.46 317.1 557.13 316.8 540.99 317.41C536.8 322.42 533.82 334.35 531.05 340.78C523.06 359.37 515.47 378.12 507.47 396.71C481.23 457.69 456.33 519.24 430.24 580.29C421.53 600.69 413.65 621.47 404.6 641.72C402.45 646.53 400.62 651.4 398.71 656.3C397.7 658.9 395.97 661.24 397.25 663.89C393.14 666.46 390.6 676.47 388.83 681.11C385.64 689.5 381.65 697.57 378.03 705.78C375.49 711.54 373.63 717.62 370.79 723.25C365.75 725.3 347.54 723.73 340.87 723.88C315.32 724.44 289.73 723.89 264.18 724.01C255.77 724.05 247.34 724.23 238.93 723.92C235.16 723.79 231.02 724.32 227.71 722.63C230.5 711.05 236.9 699.94 241.56 688.99C249.35 670.7 256.43 652.17 264.02 633.8C266.89 626.84 270.49 620.14 273.23 613.1C284.71 583.5 297.33 554.43 309.77 525.28C312.42 519.08 314.42 512.64 316.93 506.4C327.26 480.73 338.3 455.39 349.01 429.88C359.88 404.01 370.86 378.38 380.76 352.27C383.69 344.54 387.52 337.09 390.69 329.45C392.12 326 394.34 321.91 394.17 318.2C331.83 317.92 269.48 317.63 207.14 317.35C206.03 311.02 212.64 300.35 215.18 294.14C217.67 288.1 219.6 281.8 222.05 275.74C224.43 269.82 227.36 264.17 229.63 258.18C231.65 252.84 233.51 247.21 236.13 242.14C242.42 240.59 251.87 241.78 258.59 241.81C272.61 241.89 286.62 241.7 300.65 241.8C342.69 242.1 384.73 241.45 426.76 241.73C442.69 241.84 458.64 241.36 474.57 241.7C478.85 241.79 489.82 243.24 492.51 240.23Z" fill="currentColor" fill-rule="evenodd"/></svg>';

const D = {
  no: 'CNV_0142', ref: 'S07983', component: '1.2 · Ambulance Folding Stretcher',
  ask: 'Folding stretcher, not less than 2,000 mm, aluminium, with restraint straps. Qty 1.',
  entity: 'TG Enterprise', raised: '11 Sep 2026', by: 'J. Bautista',
  offers: [
    { supplier: 'Redleaf Medical Supplies', brand: 'Redleaf', model: 'RL-FS190',
      desc: 'Aluminium folding stretcher, 1,900 × 550 mm, 159 kg load, restraint straps, carry bag.',
      price: 78000, cur: 'PHP', php: 78000, lead: '14 days', valid: '30 Sep 2026',
      quality: 'Used on S07799; no failures in 12 months.', brochure: 'RL-FS190.pdf', link: 'redleaf.com.ph/rl-fs190',
      remarks: '1,900 mm against a 2,000 mm requirement. Deviation recorded on the S0 Evaluation.', win: true },
    { supplier: 'MedSupply PH', brand: 'Ferno', model: 'F-2000A',
      desc: 'Aluminium folding stretcher, 2,010 × 560 mm, 170 kg load, restraint straps.',
      price: 82500, cur: 'PHP', php: 82500, lead: '7 days', valid: '25 Sep 2026',
      quality: 'First purchase from this supplier.', brochure: 'ferno-2000a.pdf', link: 'medsupply.ph/f-2000a',
      remarks: 'Meets the length. ₱4,500 dearer and no history with us.', win: false },
    { supplier: 'Dragon Safety HK', brand: 'Dragon', model: 'DS-FS20',
      desc: 'Aluminium folding stretcher, 2,000 × 550 mm, 150 kg load, straps sold separately.',
      price: 1280, cur: 'USD', php: 72400, lead: '45 days', valid: '18 Sep 2026',
      quality: 'Unknown supplier; no sample seen.', brochure: '—', link: 'dragonsafety.hk/ds-fs20',
      remarks: 'Cheapest, but 45 days against a delivery due in 21, and straps are extra.', win: false }
  ],
  sigs: [
    { k: 'Canvassed by', who: 'J. Bautista', role: 'Purchasing · 114', stamp: 'signed 11 Sep 2026', printed: true },
    { k: 'Checked by', who: 'L. Santos', role: 'Purchasing assistant', stamp: 'name printed · no stored signature', printed: false },
    { k: 'Approved by', who: 'A. Dela Cruz', role: 'Purchasing Manager · 1001', stamp: 'Signature required', awaiting: true }
  ]
};
const peso = n => '₱' + n.toLocaleString('en-PH', { maximumFractionDigits: 0 });
const quoted = o => o.cur === 'PHP' ? peso(o.price) : 'USD ' + o.price.toLocaleString('en-US');
const winner = D.offers.find(o => o.win);

const rail = sub => `<div class="rail"><span class="mark">${MARK}</span>
  <span class="org"><b>T3CKGROUP</b>${D.entity} · purchasing</span>
  <span class="doc"><div class="t">Canvass</div><div class="s">${D.no} · ${sub}</div></span></div>`;

const facts = () => `<div>
  <div class="facts">
    <div class="fact"><span class="k">For</span><span class="v">${D.component}</span></div>
    <div class="fact"><span class="k">SOR</span><span class="v m">${D.ref}</span></div>
    <div class="fact"><span class="k">Raised</span><span class="v">${D.raised} · ${D.by}</span></div>
    <div class="fact"><span class="k">Offers</span><span class="v m">${D.offers.length}</span></div>
  </div>
  <div class="ask-box" style="margin-top:4px"><b>Requirement:</b> ${D.ask}</div>
</div>`;

const sigs = () => `<div class="sigs">${D.sigs.map(s => `<div class="sig${s.awaiting ? ' awaiting' : ''}">
  <div class="k">${s.k}</div>
  <div class="plate">${s.printed ? `<span class="printed">${s.who}</span>` : ''}</div>
  <div class="who">${s.who}</div><div class="role">${s.role}</div>
  <div class="stamp">${s.stamp}</div></div>`).join('')}</div>`;

const foot = () => `<div class="foot"><span>${D.no} · ${D.ref} · printed 15 Sep 2026</span><span>Three offers compared · minimum met</span><span>sheet 1 of 1</span></div>`;

// A — offers as columns, attributes down the side
function variantA() {
  const row = (k, fn) => `<div class="k">${k}</div>` + D.offers.map(o => `<div class="${o.win ? 'winner' : ''}">${fn(o)}</div>`).join('');
  return `<div class="sheet">
    ${rail('comparison')}
    ${facts()}
    <div class="grid">
      <div class="k head">Supplier</div>
      ${D.offers.map(o => `<div class="head ${o.win ? 'winner' : ''}">
        <b>${o.supplier}</b>
        <div class="sub">${o.brand} ${o.model}</div>
        ${o.win ? '<div style="margin-top:3px"><span class="chip win">✓ Chosen offer</span></div>' : ''}
      </div>`).join('')}
      ${row('Offer spec', o => o.desc)}
      ${row('Unit price', o => `<div class="m" style="font-size:10.5pt;font-weight:700;color:var(--ink)">${quoted(o)}</div>${o.cur !== 'PHP' ? `<div class="sub m" style="margin-top:2px">≈ ${peso(o.php)}</div>` : ''}`)}
      ${row('Lead time', o => `<span style="font-weight:600">${o.lead}</span>`)}
      ${row('Quote valid to', o => `<span class="m">${o.valid}</span>`)}
      ${row('Quality note', o => o.quality)}
      ${row('Brochure', o => o.brochure === '—' ? '<span class="chip warn">none</span>' : `<span class="m" style="font-size:7.4pt">📄 ${o.brochure}</span>`)}
      ${row('Source', o => `<span class="sub m" style="font-size:7.2pt">${o.link}</span>`)}
      ${row('Remarks', o => `<span style="line-height:1.35">${o.remarks}</span>`)}
    </div>
    ${sigs()}
    ${foot()}
  </div>`;
}

// B — a block per supplier, price on the right
function variantB() {
  return `<div class="sheet">
    ${rail('offers')}
    ${facts()}
    <div>
      ${D.offers.map(o => `<div class="offer ${o.win ? 'win' : ''}">
        <div>
          <h3>${o.supplier} ${o.win ? '<span class="chip win">chosen</span>' : ''}</h3>
          <div class="sub">${o.brand} ${o.model} · ${o.link}</div>
          <p style="margin:4px 0 3px">${o.desc}</p>
          <div class="sub">Quality: ${o.quality}</div>
          <div class="sub">Remarks: ${o.remarks}</div>
        </div>
        <div class="right">
          <div><div class="k">Unit price</div><div class="v">${quoted(o)}${o.cur !== 'PHP' ? `<small>≈ ${peso(o.php)}</small>` : ''}</div></div>
          <div><div class="k">Lead time</div><div class="v">${o.lead}</div></div>
          <div><div class="k">Valid to</div><div class="v" style="font-size:9pt">${o.valid}</div></div>
          <div><div class="k">Brochure</div><div class="v" style="font-size:8pt">${o.brochure}</div></div>
        </div>
      </div>`).join('')}
    </div>
    ${sigs()}
    ${foot()}
  </div>`;
}

// C — the recommendation first, the comparison as evidence beneath
function variantC() {
  return `<div class="sheet">
    ${rail('recommendation')}
    ${facts()}
    <div class="decision">
      <div>
        <h2>${winner.supplier}</h2>
        <div class="sub">${winner.brand} ${winner.model} · ${winner.lead} · quote valid to ${winner.valid}</div>
        <p class="why" style="margin:5px 0 0">Chosen on delivery and history rather than price: the cheaper Hong Kong offer needs 45 days against a delivery due in 21 and sells the straps separately, and the compliant Ferno is ₱4,500 dearer from a supplier we have never bought from. <b>The 1,900 mm length is a recorded deviation</b> on the S0 Evaluation, not an oversight.</p>
      </div>
      <div class="price"><div class="k">Unit price</div><div class="v">${peso(winner.php)}</div><div class="sub">against ₱82,500 and ₱72,400</div></div>
    </div>
    <table>
      <thead><tr><th>Supplier</th><th>Offered</th><th class="num">Quoted</th><th class="num">In PHP</th><th>Lead</th><th>Valid to</th><th>Brochure</th></tr></thead>
      <tbody>
        ${D.offers.map(o => `<tr>
          <td><b>${o.supplier}</b>${o.win ? ' <span class="chip win">chosen</span>' : ''}<div class="sub">${o.brand} ${o.model}</div></td>
          <td>${o.desc}<div class="sub">${o.remarks}</div></td>
          <td class="num">${quoted(o)}</td>
          <td class="num">${peso(o.php)}</td>
          <td>${o.lead}</td>
          <td>${o.valid}</td>
          <td>${o.brochure === '—' ? '<span class="chip warn">none</span>' : o.brochure}</td>
        </tr>`).join('')}
      </tbody>
    </table>
    ${sigs()}
    ${foot()}
  </div>`;
}

const VARIANTS = [
  { key: 'A', name: 'Comparison grid', render: variantA },
  { key: 'B', name: 'Offer blocks', render: variantB },
  { key: 'C', name: 'Recommendation first', render: variantC }
];
function currentKey() { const p = new URLSearchParams(location.search).get('variant'); return VARIANTS.some(v => v.key === p) ? p : 'A'; }
function show(key) {
  const v = VARIANTS.find(x => x.key === key) || VARIANTS[0];
  document.getElementById('stage').innerHTML = v.render();
  document.getElementById('vname').textContent = v.name;
  document.getElementById('vkey').textContent = 'Variant ' + v.key;
  const url = new URL(location.href); url.searchParams.set('variant', v.key); history.replaceState(null, '', url);
}
function step(n) { const i = VARIANTS.findIndex(v => v.key === currentKey()); show(VARIANTS[(i + n + VARIANTS.length) % VARIANTS.length].key); }
document.getElementById('prev').addEventListener('click', () => step(-1));
document.getElementById('next').addEventListener('click', () => step(1));
document.addEventListener('keydown', e => {
  const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1);
});
show(currentKey());
</script>
