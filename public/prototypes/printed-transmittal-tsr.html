    <td class="m" style="font-weight:600">${u.n}</td>
    <td class="m" style="font-weight:600">${u.serial}</td>
    <td>${u.verdict === 'Pass' ? '<span class="chip ok">✓ pass</span>' : '<span class="chip bad">✗ fail</span>'}</td>
    <td>${u.note}</td>
  </tr>`).join('')}</tbody></table>`;

const tsrIncl = () => `<div class="box"><div class="h">Inclusions present · ${TSR.inclusions.filter(i => i[1]).length} of ${TSR.inclusions.length} checked</div>
  <div class="incl">${TSR.inclusions.map(i => `<span class="${i[1] ? '' : 'miss'}"><span class="chk ${i[1] ? 'done' : ''}">${i[1] ? '✓' : ''}</span> ${i[0]}</span>`).join('')}</div></div>`;

const tsrPhotos = () => `<div class="box"><div class="h">Evidence · ${TSR.photos.length} photographs, 1 video (${TSR.video})</div>
  <div class="photos">${TSR.photos.map(p => `<div class="photo">📷 ${p}</div>`).join('')}</div></div>`;

const foot = (l, r) => `<div class="foot"><span>${l}</span><span>${r}</span><span>printed 15 Sep 2026</span></div>`;

// A — two full forms, one per sheet
function variantA() {
  return `<div class="sheet">
    ${rail('Transmittal', TRN.no, TRN.form)}
    ${route()}
    ${trnFacts()}
    ${trnTable()}
    ${trnDocs()}
    <div class="sigs n3">${TRN.sigs.map(sigBlock).join('')}</div>
    ${foot(TRN.no + ' · ' + TRN.sors, '1 of 3 lines damaged on receipt')}
  </div>
  <div class="sheet">
    ${rail('Technical Service Report', TSR.no, null)}
    ${tsrHead()}
    ${tsrUnits()}
    ${tsrIncl()}
    ${tsrPhotos()}
    <div class="sigs n2">${TSR.sigs.map(sigBlock).join('')}<div class="sig"><div class="k">Noted by (purchasing)</div><div class="plate"></div><div class="who">&nbsp;</div><div class="role">on the failed unit</div><div class="stamp">optional</div></div></div>
    ${foot(TSR.no + ' · follows ' + TSR.trn, '1 unit failed of 2')}
  </div>`;
}

// B — the house idiom: two half-letter forms on one page
function variantB() {
  return `<div class="halfpage">
    <div class="half">
      ${rail('Transmittal', TRN.no, TRN.form)}
      ${route()}
      ${trnTable()}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:5mm">
        ${trnDocs()}
        <div class="box"><div class="h">Reason and location</div><div>${TRN.reason}</div><div class="sub">${TRN.location} · ${TRN.sors}</div></div>
      </div>
      <div class="sigs n3">${TRN.sigs.map(sigBlock).join('')}</div>
      ${foot(TRN.no, 'half 1 · hand-off')}
    </div>
    <div class="half">
      ${rail('Technical Service Report', TSR.no, null)}
      ${tsrHead()}
      ${tsrUnits()}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:5mm">
        ${tsrIncl()}
        <div class="box"><div class="h">Evidence</div><div>${TSR.photos.length} photographs, 1 video</div><div class="sub">${TSR.video} · held in the ERP, not printed</div></div>
      </div>
      <div class="sigs n2">${TSR.sigs.map(sigBlock).join('')}<div class="sig"><div class="k">Received back by</div><div class="plate"></div><div class="who">&nbsp;</div><div class="role">Purchasing</div><div class="stamp">on return of the failed unit</div></div></div>
      ${foot(TSR.no, 'half 2 · check')}
    </div>
  </div>`;
}

// C — transmittal with a tear-off receipt, TSR as an evidence sheet
function variantC() {
  return `<div class="sheet">
    ${rail('Transmittal', TRN.no, TRN.form)}
    ${route()}
    ${trnFacts()}
    ${trnTable()}
    ${trnDocs()}
    <div class="sigs n2">${[TRN.sigs[0], TRN.sigs[1]].map(sigBlock).join('')}</div>
    <div class="stub">
      <div>
        <div class="scissors">&#9986; Receipt — detach, sign and return to Purchasing</div>
        <div><b>${TRN.no}</b> · ${TRN.lines.length} lines · ${TRN.from} &#8594; ${TRN.to} · handed over ${TRN.date}</div>
        <div class="sub">Received as: ${TRN.lines.map(l => l.n + '. ' + (l.cond.startsWith('Received') ? 'received' : 'damaged')).join(' · ')}</div>
        <div class="sub">Anything short or damaged is written on the line above before signing.</div>
      </div>
      <div class="sigs n1" style="grid-template-columns:1fr;margin-top:0;padding-top:0">${sigBlock(TRN.sigs[2])}</div>
    </div>
    ${foot(TRN.no + ' · ' + TRN.sors, 'receipt stub below the fold')}
  </div>
  <div class="sheet land">
    ${rail('Technical Service Report', TSR.no + ' · evidence sheet', null)}
    ${tsrHead()}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6mm">
      <div>${tsrUnits()}${tsrIncl()}</div>
      <div>${tsrPhotos()}</div>
    </div>
    <div class="sigs n2">${TSR.sigs.map(sigBlock).join('')}<div class="sig"><div class="k">Noted by (purchasing)</div><div class="plate"></div><div class="who">&nbsp;</div><div class="role">on the failed unit</div><div class="stamp">optional</div></div></div>
    ${foot(TSR.no + ' · follows ' + TSR.trn, 'landscape · photographs printed')}
  </div>`;
}

const VARIANTS = [
  { key: 'A', name: 'Two full forms', render: variantA },
  { key: 'B', name: 'Half-letter pair', render: variantB },
  { key: 'C', name: 'Receipt stub + evidence sheet', render: variantC }
];
function currentKey() { const p = new URLSearchParams(location.search).get('variant'); return VARIANTS.some(v => v.key === p) ? p : 'A'; }
function show(key) {
  const v = VARIANTS.find(x => x.key === key) || VARIANTS[0];
  document.getElementById('stage').innerHTML = v.render();
  document.getElementById('vname').textContent = v.name;
  document.getElementById('vkey').textContent = 'Variant ' + v.key;
  const url = new URL(location.href); url.searchParams.set('variant', v.key); history.replaceState(null, '', url);
}
function step(n) { const i = VARIANTS.findIndex(v => v.key === currentKey()); show(VARIANTS[(i + n + VARIANTS.length) % VARIANTS.length].key); }
document.getElementById('prev').addEventListener('click', () => step(-1));
document.getElementById('next').addEventListener('click', () => step(1));
document.addEventListener('keydown', e => {
  const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1);
});
show(currentKey());
</script>
