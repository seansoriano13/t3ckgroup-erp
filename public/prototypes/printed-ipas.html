<!DOCTYPE html>
<html lang="en">
<head>

<title>Printed IPAS</title>

  Three treatments, switchable with ?variant=A|B|C, the bar, or the arrow keys.
  Sections follow the sheet (1, 2, 3, 5, 6, 7 — section 4 removed) and the decisions
  on payments and charges, Odoo-stamped statuses, documents with two ticks, and filing.
  Sample is TGIPAS_050, the imported stretcher order on S07983. Print idiom: ADR 0014.

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Spectral:ital,wght@0,400;0,600;1,400;1,600&display=swap">
<style>
  :root {
    --desk: #e7e3dc;
    --desk-ink: #1f2328;
    --desk-soft: #57606a;
    --desk-edge: #cdc7bd;
    --shadow: 0 1px 3px rgba(24,22,18,.12), 0 16px 36px rgba(24,22,18,.14);

    --paper: #ffffff;
    --ink: #0f172a;        /* High-contrast black slate for crisp legibility */
    --ink-mid: #1e293b;    /* Structured headings & prominent text */
    --ink-soft: #334155;   /* Secondary information (7.5:1 contrast) */
    --ink-faint: #64748b;  /* Uppercase category labels (5.0:1 contrast) */
    --rule: #cbd5e1;       /* Clean crisp borders */
    --hair: #e2e8f0;       /* Fine row division */
    --wash: #f8fafc;       /* Card/section header wash */
    --wash-dark: #f1f5f9;  /* Contrast row tint */
    --accent: #0f5b47;     /* Brand emerald / accent */
    --accent-soft: #ecfdf5;
    --accent-border: #a7f3d0;
    --flag: #b91c1c;       /* Semantic alert */
    --flag-bg: #fef2f2;
    --flag-border: #fecaca;
    --ok: #15803d;         /* Semantic success */
    --ok-bg: #f0fdf4;
    --ok-border: #bbf7d0;
    --warn: #b45309;
    --warn-bg: #fffbeb;
    --warn-border: #fde68a;

    --sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
    --serif: "Spectral", ui-serif, Georgia, "Times New Roman", serif;

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --desk: #14171a;
      --desk-ink: #f0f2f5;
      --desk-soft: #9aa4ae;
      --desk-edge: #272c33;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 34px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    --desk: #14171a;
    --desk-ink: #f0f2f5;
    --desk-soft: #9aa4ae;
    --desk-edge: #272c33;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 34px rgba(0,0,0,.45);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--desk);
    color: var(--desk-ink);

    font-size: 14px;
    -webkit-font-smoothing: antialiased;

  .desk {

    padding-right: 16px;

    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  .desk-head { width: min(1100px, 100%); display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; }
  .desk-head h1 { font-family: var(--serif); font-size: 21px; font-weight: 600; margin: 0; color: var(--desk-ink); }
  .desk-head p { margin: 0; color: var(--desk-soft); font-size: 13px; max-width: 66ch; }
  .desk-head .tag { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--desk-soft); border: 1px solid var(--desk-edge); border-radius: 3px; padding: 2px 7px; }

  /* ── Sheet Container ── */
  .sheet {
    color-scheme: light !important;
    width: 210mm;
    min-height: 297mm;
    padding: 11mm 13mm 11mm;
    background: var(--paper) !important;
    color: var(--ink) !important;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 4mm;
    font-size: 8.6pt;
    line-height: 1.34;
    border-radius: 2px;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .sheet.land { width: 297mm; min-height: 210mm; }

  /* Table text color isolation */
  .sheet table, .sheet tr, .sheet th, .sheet td {
    color: var(--ink) !important;
    font-family: inherit;
  }

  /* ── Rail (Header) ── */
  .rail { display: flex; align-items: flex-end; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; margin-bottom: 2mm; }
  .rail .mark { width: 24px; height: 24px; color: var(--accent); flex: none; }
  .rail .mark svg { width: 100%; height: 100%; display: block; }
  .rail .org { font-size: 7.4pt; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); line-height: 1.25; font-weight: 500; }
  .rail .org b { display: block; font-size: 10.5pt; letter-spacing: .04em; color: var(--ink); font-weight: 700; }
  .rail .doc { margin-left: auto; text-align: right; }
  .rail .doc .t { font-family: var(--serif); font-size: 16pt; font-weight: 600; line-height: 1; color: var(--ink); }
  .rail .doc .s { font-family: var(--mono); font-size: 7.5pt; color: var(--ink-soft); font-weight: 500; margin-top: 3px; }

  /* ── Metadata Header: Clean, open, no heavy box border ── */
  .hdr {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px 14px;
    border-top: 1px solid var(--hair);
    border-bottom: 1px solid var(--hair);
    padding: 9px 2px;
    background: transparent;
  }
  .f .k { font-size: 6.5pt; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); display: block; font-weight: 600; margin-bottom: 2px; }
  .f .v { font-size: 9pt; font-weight: 600; color: var(--ink); }
  .f .v.m { font-family: var(--mono); font-weight: 500; }
  .f .v.big { font-size: 10pt; }
  .f .v .tag-priority {
    display: inline-block;
    padding: 1px 6px;
    font-size: 7.2pt;
    font-weight: 700;
    border-radius: 3px;
    background: var(--warn-bg);
    color: var(--warn);

    border: none;
    background: transparent;
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 2mm;

  .sec > h3 {
    margin: 0;
    font-size: 7.6pt;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-mid);
    background: transparent;
    border-bottom: 1.5px solid var(--hair);
    padding: 0 0 5px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
  }
  .sec > h3 b {
    font-family: var(--mono);
    color: var(--ink-soft);
    font-weight: 500;
    letter-spacing: 0;
    font-size: 7.2pt;
    background: var(--wash);
    border-radius: 3px;
    padding: 1px 7px;

  .sec > .body {
    padding: 6px 0;
    display: flex;
    flex-direction: column;
    gap: 8px;

  .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; }
  .cols3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5mm; }
  .fields { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 16px; }
  .fields.n2 { grid-template-columns: repeat(2, 1fr); }
  .fields.n3 { grid-template-columns: repeat(3, 1fr); }

  /* ── Tables: Light row dividers, open and airy ── */
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; vertical-align: middle; padding: 6px 8px; border-bottom: 1px solid var(--hair); font-size: 8.4pt; }
  thead th {
    font-size: 6.6pt;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    border-bottom: 1.5px solid var(--rule);
    padding: 5px 8px;
    background: transparent;
  }
  thead th.num, td.num { text-align: right; font-family: var(--mono); }
  thead th.center, td.center { text-align: center; }
  tfoot td {
    font-weight: 700;
    border-top: 1.5px solid var(--rule);
    border-bottom: 0;
    background: transparent;
    padding: 7px 8px;
    font-size: 8.6pt;

  .m { font-family: var(--mono); }
  .miss { color: var(--flag); }

    align-items: center;
    justify-content: center;
    width: 13px;
    height: 13px;
    border-radius: 2.5px;
    border: 1px solid var(--rule);
    background: #ffffff;
    font-size: 8pt;
    line-height: 1;
    color: transparent;
    vertical-align: middle;
  }
  .chk.done {
    background: var(--ok-bg);
    border-color: var(--ok-border);
    color: var(--ok);
    font-weight: 700;
  }
  .chk.miss {
    background: var(--flag-bg);
    border-color: var(--flag-border);
    color: var(--flag);
    font-weight: 700;
  }

  /* ── Status List ── */
  .stat { display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .stat .s {
    font-size: 7.4pt;
    display: inline-flex;
    gap: 5px;
    align-items: center;
    padding: 2.5px 8px;
    border-radius: 4px;
    background: var(--wash);

  .stat .s.done { background: var(--ok-bg); color: var(--ok); font-weight: 600; }

  .stat .s .d { font-family: var(--mono); color: var(--ink-soft); font-size: 6.8pt; font-weight: 500; }

  /* ── Signatures: Prestigious open document layout ── */
  .sigs { display: grid; gap: 6mm; margin-top: 2mm; }
  .sigs.n2 { grid-template-columns: repeat(2, 1fr); }
  .sigs.n4 { grid-template-columns: repeat(4, 1fr); }
  .sig {
    display: flex;
    flex-direction: column;
    background: transparent;
    border: none;
    padding: 0;
  }
  .sig .k { font-size: 6.4pt; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
  .sig .plate {
    height: 11mm;
    border-bottom: 1.2px solid var(--ink);
    display: flex;
    align-items: flex-end;
    padding-bottom: 3px;
    margin-top: 4px;
  }
  .sig .plate .printed {
    font-family: var(--serif);
    font-style: italic;
    font-size: 11pt;
    font-weight: 600;
    color: var(--ink);
  }
  .sig .who { font-size: 8.2pt; font-weight: 600; color: var(--ink); margin-top: 4px; }
  .sig .role { font-size: 6.8pt; color: var(--ink-soft); }
  .sig .stamp { font-family: var(--mono); font-size: 6.4pt; color: var(--ink-faint); margin-top: 1px; }
  .sig.awaiting .plate { border-bottom-style: dashed; border-bottom-color: var(--rule); }
  .sig.awaiting .stamp { color: var(--warn); font-weight: 600; }

  .bank-box {
    border-radius: 4px;
    padding: 8px 12px;
    background: var(--wash);
    margin-top: 6px;
  }

  /* ── Footer ── */
  .foot {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    border-top: 1px solid var(--hair);
    padding-top: 4px;
    font-size: 6.8pt;
    color: var(--ink-faint);
    font-family: var(--mono);
    margin-top: auto;
  }
  .prov {
    display: inline-block;
    padding: 0 4px;
    font-size: 6.4pt;
    font-weight: 600;
    text-transform: uppercase;
    border-radius: 2.5px;
    background: var(--warn-bg);
    color: var(--warn);
    border: 1px solid var(--warn-border);
  }

  /* ── Floating Switcher ── */
  .switcher {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 50;
    display: flex;
    background: #0f172a;
    color: #f8fafc;
    border-radius: 999px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.1);
  }
  .switcher button {
    background: none;
    border: 0;
    color: inherit;
    font: inherit;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    transition: background .15s;
  }
  .switcher button:hover { background: rgba(255,255,255,.12); }
  .switcher button:focus-visible { outline: 2px solid #38bdf8; outline-offset: -3px; }
  .switcher .label {
    padding: 8px 10px;
    min-width: 210px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .switcher .label b { font-size: 13px; font-weight: 600; }
  .switcher .label span { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #94a3b8; }

  @media print {
    @page { size: A4 portrait; margin: 0; }
    body { background: #fff; }
    .desk { padding: 0; gap: 0; }
    .desk-head, .switcher { display: none !important; }
    .sheet { box-shadow: none; page-break-after: always; min-height: 297mm; }
  }
  @media (max-width: 860px) {
    .sheet, .sheet.land { width: 100%; min-height: 0; padding: 14px; font-size: 11px; }
    .hdr, .fields, .fields.n3, .fields.n2 { grid-template-columns: 1fr 1fr; }
    .cols2, .cols3 { grid-template-columns: 1fr; }
    .sigs.n4 { grid-template-columns: 1fr 1fr; }
    .switcher .label { min-width: 120px; }
  }
</style>
</head>

const VARIANTS = [
  { key: 'A', name: 'The sheet, in order', render: variantA },
  { key: 'B', name: 'One landscape sheet', render: variantB },
  { key: 'C', name: 'Money first, detail behind', render: variantC }
];
function currentKey() { const p = new URLSearchParams(location.search).get('variant'); return VARIANTS.some(v => v.key === p) ? p : 'A'; }
function show(key) {
  const v = VARIANTS.find(x => x.key === key) || VARIANTS[0];
  document.getElementById('stage').innerHTML = v.render();
  document.getElementById('vname').textContent = v.name;
  document.getElementById('vkey').textContent = 'Variant ' + v.key;
  const url = new URL(location.href); url.searchParams.set('variant', v.key); history.replaceState(null, '', url);
}
function step(n) { const i = VARIANTS.findIndex(v => v.key === currentKey()); show(VARIANTS[(i + n + VARIANTS.length) % VARIANTS.length].key); }
document.getElementById('prev').addEventListener('click', () => step(-1));
document.getElementById('next').addEventListener('click', () => step(1));
document.addEventListener('keydown', e => {
  const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1);
});
show(currentKey());
</script>
