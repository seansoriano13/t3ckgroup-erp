name: Apply migrations — staging

# Staging is the permanent integration branch (see AGENTS.md): everything
# accepted but not yet released lands here first. Migrations follow the same
# rule automatically, so the promotion path gets exercised on every push
# instead of only when someone remembers to run it by hand — which is the
# habit that produced the 23 "dummy" ledger rows and the manual
# STAGING_DB_URL scripts this replaces.
#
# Runs from CI only, never a developer machine, and always names its target
# project explicitly (--project-ref) rather than inheriting a linked default.

on:
  push:
    branches: [staging]
    paths:
      - "supabase/migrations/**"
  # After a ledger repair there is nothing to push — the files have not
  # changed, only the remote's record of them — so without this the only way
  # to re-run was to re-run an *old* run, which replays that commit's workflow
  # rather than today's. A human presses this in the Actions tab.
  workflow_dispatch:

concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  migrate:
    name: supabase db push --project-ref staging
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push pending migrations to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        # --include-all applies pending migrations whose timestamp sorts before
        # the remote's applied tip. Without it, a migration that merged from a
        # branch started earlier is refused ("before the last migration on
        # remote"), and the tempting fix is to rename the file forward — which
        # orphans whatever ledger row already recorded it and blocks the whole
        # pipeline. Two of this repo's four historical renames existed only to
        # do that. Applying out-of-order arrivals is safe here because
        # migration-gate.yml has already proven the set builds the right schema
        # from empty, in filename order, on every PR that touches migrations.
        run: supabase db push --include-all --project-ref fpjxdyowngpnovotbzqi
