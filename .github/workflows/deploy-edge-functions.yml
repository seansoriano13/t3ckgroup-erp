name: Deploy edge functions

# #333 (release/2026-09, #325): no workflow deployed edge functions, so what
# ran in each environment depended on who remembered to deploy what (prod ran
# 8, staging 7, and three the app calls ran nowhere). This deploys the
# repository's functions to a chosen environment, the same way the migration
# workflows push schema: from CI, never a developer machine, always naming the
# target project explicitly.
#
# Staging deploys itself: a push to staging that touches supabase/functions
# deploys just the functions that changed (everything, when _shared changed),
# the same way migrate-staging.yml applies migrations. Prod stays manual: press
# the button in the Actions tab and type "deploy".

on:
  push:
    branches: [staging]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, prod]
      functions:
        description: "Functions to deploy, space-separated. Blank = every function in supabase/functions (except sor-follow-up-reminders)"
        required: false
        default: ""
      dry_run:
        description: "List what would deploy, deploy nothing"
        required: false
        type: boolean
        default: false
      confirm:
        description: 'For prod: type "deploy" to confirm'
        required: false
        default: ""

concurrency:
  group: deploy-edge-functions-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: supabase functions deploy (${{ github.event.inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Fail, not skip: a skipped job shows green and reads as "deployed".
      - name: Require confirmation for prod
        if: github.event.inputs.environment == 'prod' && github.event.inputs.confirm != 'deploy' && github.event.inputs.dry_run != 'true'
        run: |
          echo '::error::Deploying to prod needs confirm = "deploy" (or dry_run).'
          exit 1

      - uses: actions/checkout@v4
        with:
          # The push path diffs before..sha to find the changed functions.
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve target project and function list
        id: plan
        env:
          # A push has no inputs: it is always staging.
          TARGET: ${{ github.event.inputs.environment || 'staging' }}
          REQUESTED: ${{ github.event.inputs.functions }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Same project refs as migrate-staging.yml / migrate-prod.yml.
          case "$TARGET" in
            staging) ref=fpjxdyowngpnovotbzqi ;;
            prod)    ref=epqmberwewztzbrkhhss ;;
            *) echo "Unknown environment: $TARGET" >&2; exit 1 ;;
          esac

          # Every function directory in the repo. _shared is imported code,
          # not a function. sor-follow-up-reminders stays out of the default
          # until the follow-up sender ships (out of scope for #325); name it
          # explicitly to deploy it anyway.
          available=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_*' -printf '%f\n' | sort)

          if [ -n "${REQUESTED// /}" ]; then
            list=""
            for fn in $REQUESTED; do
              if ! grep -qx "$fn" <<< "$available"; then
                echo "::error::No function named '$fn' in supabase/functions"
                exit 1
              fi
              list="$list $fn"
            done
          else
            list=$(grep -vx 'sor-follow-up-reminders' <<< "$available" | tr '\n' ' ')
            # On a push, narrow to what changed. A change under _shared, or a
            # diff we cannot take (new branch, force push), keeps the full list.
            if [ "$EVENT" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- supabase/functions)
              if ! grep -q '^supabase/functions/_' <<< "$changed"; then
                narrowed=""
                for fn in $list; do
                  if grep -q "^supabase/functions/$fn/" <<< "$changed"; then
                    narrowed="$narrowed $fn"
                  fi
                done
                list="$narrowed"
              fi
            fi
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Target: $TARGET ($ref)"
          echo "Functions:"; for fn in $list; do echo "  - $fn"; done

      - name: Deploy
        if: github.event.inputs.dry_run != 'true' && steps.plan.outputs.list != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ steps.plan.outputs.ref }}
          LIST: ${{ steps.plan.outputs.list }}
        # One call per function so a failure names the function. Per-function
        # settings (verify_jwt etc.) come from supabase/config.toml.
        run: |
          set -euo pipefail
          for fn in $LIST; do
            echo "::group::$fn"
            supabase functions deploy "$fn" --project-ref "$REF" --use-api
            echo "::endgroup::"
          done

      - name: Deployed functions on the target
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions list --project-ref ${{ steps.plan.outputs.ref }}
