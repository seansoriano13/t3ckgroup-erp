name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint tests
        run: pnpm lint:tests

      # The application has a pre-existing lint backlog (~38 errors) that
      # predates this workflow. Reported so it stays visible, but not yet a
      # merge blocker — flip this to a hard gate once the backlog is cleared.
      - name: Lint application
        run: pnpm lint
        continue-on-error: true

      - name: Test
        run: pnpm test

      # The suite talks to a fake Supabase, so no secrets are needed here —
      # .env.test supplies the placeholder values Vite expects.
      - name: Build
        run: pnpm build
