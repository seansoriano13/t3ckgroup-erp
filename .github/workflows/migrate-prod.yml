name: Apply migrations — production

# Deliberately NOT automatic. Staging exercises the same push mechanism on
# every commit, so by the time this runs it is a proven path — but a human
# decides *when* production DDL runs, they just never type the command
# themselves (that habit is what produced the ledger drift this whole
# pipeline exists to stop). Press the button in the Actions tab.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to confirm — this runs pending migrations against production'
        required: true
      include_all:
        description: 'Apply pending migrations that sort before prod''s tip (--include-all). Off by default.'
        type: boolean
        default: false

concurrency:
  group: migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    name: supabase db push --project-ref prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.inputs.confirm == 'apply'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hard pre-flight gate (#332). Fails the job, before anything is pushed,
      # on any ledger orphan (push would refuse everything) or any pending
      # migration that sorts before the remote tip (push would skip it or apply
      # around it). The output names each offender. Fix the ledger with the
      # repair workflow; never rename a migration file to match it.
      - name: Ledger check (must pass before push)
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: pnpm db:ledger:check prod ${{ inputs.include_all && '--include-all' || '' }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: List pending migrations (review before they run)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: supabase migration list --project-ref epqmberwewztzbrkhhss

      - name: Push pending migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: supabase db push ${{ inputs.include_all && '--include-all' || '' }} --project-ref epqmberwewztzbrkhhss
