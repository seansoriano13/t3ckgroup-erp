# Local Supabase stack (issue #87). `project_id` is a local identifier, not
# a remote project ref — a bare `supabase` command on this machine cannot
# address staging or production by accident. Reach a remote project only by
# passing its --project-ref explicitly (as every CI workflow already does).
project_id = "t3ckgroup-erp-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
# Seeding is a deliberate, separate step (scripts/seed-restore.mjs, from a
# sanitized staging dump) rather than a committed seed.sql — see AGENTS.md.
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
# localhost, not 127.0.0.1: `{{ .SiteURL }}` in the recovery template builds
# the link the browser opens, and a link on a different origin from the one you
# are browsing lands on a tab with none of the app's stored session. Vite prints
# localhost, so that is the origin people are actually on. Both are allowed
# below, which covers redirect_to either way; only this one shapes the email.
site_url = "http://localhost:5173"
# Wildcarded so the password-reset email's redirectTo (…/reset-password) is
# actually honoured — GoTrue silently falls back to site_url for any
# redirect_to that isn't an exact match or covered by a pattern here.
# Same wildcard needs adding in staging/production's Auth > URL
# Configuration (this file only controls the local stack).
additional_redirect_urls = [
  "http://127.0.0.1:5173/**",
  "http://localhost:5173/**",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

# The reset email links straight at the SPA (/reset-password?token_hash=…),
# not at GoTrue's /auth/v1/verify GET hop, so the one-time token survives
# mail-scanner and browser prefetches and is only redeemed by verifyOtp() in
# the real browser. Staging/production carry the same body in their dashboard
# template (this file only drives the local stack).
[auth.email.template.recovery]
subject = "Reset your T3ckgroup password"
content_path = "./supabase/templates/recovery.html"

[auth.external.google]
enabled = true
client_id = "657214572650-l21fq9k3kp078k343go0o22toagqgirs.apps.googleusercontent.com"
secret = "dummy-secret"
redirect_uri = "http://127.0.0.1:5173"

[realtime]
# Disabled locally (issue #87): the spec scopes local dev to Postgres, Auth
# and PostgREST only ("Out of Scope: Local Storage, Realtime or Studio beyond
# whatever supabase start provides by default"), and the CLI's realtime
# image (public.ecr.aws/supabase/realtime:v2.129.3) currently ships a 0-byte
# libapparmor.so.1, which fails its own internal migration and takes the
# whole local stack down with it. Realtime subscriptions are inert locally
# either way (see docs/testing.md's fake-DB limitations) — this just stops a
# broken container from blocking `supabase start` entirely.
#
# Live updates are still testable locally: `pnpm local:realtime` runs the
# older, working image (v2.124.2) beside the stack under the alias Kong already
# routes to — see scripts/local-realtime.mjs. Re-run it after `supabase db
# reset`, which recreates the `realtime` schema it depends on.
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[local_smtp]
enabled = true
port = 54324

# Disabled locally: the CLI's analytics image (public.ecr.aws/supabase/
# logflare:1.50.4) fails every exec inside its own container ("exec format
# error" on /usr/bin/sh) even from a byte-verified fresh pull on a clean WSL2
# VM — an upstream image problem, not something fixable from this repo. It
# only backs Studio's Logs Explorer tab; every other Studio page, and the
# whole app, work without it.
[analytics]
enabled = false

# The edge runtime is disabled locally: the seven odoo-* functions below need
# live Odoo credentials to do anything meaningful, so a local copy would test
# nothing (see AGENTS.md and docs/adr/0011). They stay declared so "Deploy to
# production" keeps auto-shipping function changes — that's their only job
# in this file.
[edge_runtime]
enabled = true

# Unlike the odoo-* functions above, this one needs nothing but the local
# Supabase stack's own (deterministic, committed) keys — it works locally.
[functions.manage-employee-password]

[functions.send-push]

# The two cron-driven functions authenticate themselves (Bearer CRON_SECRET or the
# service-role key, _shared/cronAuth.ts). With the gateway's JWT check on, a
# CRON_SECRET bearer is refused before the function runs, and the public anon key
# is let through to it (#457).
[functions.sor-follow-up-reminders]
verify_jwt = false

[functions.odoo-sor-sync]
verify_jwt = false

[functions.odoo-document-admin]
[functions.odoo-po-ipas]
[functions.odoo-po-rollup]
[functions.odoo-po-verify]
[functions.odoo-quotation-file]
[functions.odoo-quotation-link]
[functions.odoo-quotation-manifest]
[functions.odoo-sor-lookup]
[functions.odoo-supplier-search]
